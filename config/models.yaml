# Model routing per stage (GOD_PROMPT §3, DECISIONS D14).
#
# backend: claude_code  -> runs `claude -p` with the owner's Claude Pro subscription
#                          (CLAUDE_CODE_OAUTH_TOKEN). $0 extra; counts against plan limits.
# backend: api          -> Anthropic API key, billed per token. Disabled unless owner opts in.
backend: claude_code

# Opus may not be available on Pro in Claude Code, so every Opus stage names a fallback.
# Writer (Sonnet) and fact judge (Opus) differ so nothing grades its own work; if the
# judge falls back to Sonnet it runs in a fresh session with a separate judge prompt.
stages:
  weekly_planning:    {model: claude-opus-5-5,   fallback: claude-sonnet-5-5, effort: high}
  discover:           {model: claude-sonnet-5-5, effort: medium, tools: [WebSearch, WebFetch]}
  verify:             {model: claude-sonnet-5-5, effort: high,   tools: [WebSearch, WebFetch]}
  script:             {model: claude-sonnet-5-5, effort: high}
  compilation_script: {model: claude-sonnet-5-5, effort: high}
  metadata:           {model: claude-haiku-5-5,  effort: low}
  qa_fact:            {model: claude-opus-5-5,   fallback: claude-sonnet-5-5, effort: medium}
  qa_policy:          {model: claude-haiku-5-5,  effort: medium}
  qa_visual:          {model: claude-sonnet-5-5, effort: low}
  scene_spec:         {model: claude-haiku-5-5,  effort: low}

# Only used if backend: api. USD per 1M tokens, checked 2026-11.
pricing:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01}
batch_discount: 0.5

images:
  provider: fal          # fal | replicate
  model: flux-schnell
  usd_per_image: 0.003
  stills_per_short: 8

tts:
  provider: kokoro       # kokoro (local, free) | elevenlabs (optional)
