# Nightly production: make tonight's shorts, refill the buffer, schedule today's slots.
# Runs 06:17 UTC = 01:17 EST / 02:17 EDT, inside the overnight Claude window.
name: nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Produce but never upload"
        type: boolean
        default: true
permissions:
  contents: write     # state branch + buffer release
  issues: write       # alerts
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  nightly:
    if: vars.PIPELINE_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          media: "true"
      - name: Restore state
        run: scripts/state.sh pull
      - name: Pull analytics (feeds the hook/CTA bandits)
        continue-on-error: true
        run: uv run --no-sync acw analytics
      - name: Nightly run
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then uv run --no-sync acw nightly --dry-run
          else uv run --no-sync acw nightly; fi
      - name: Save state
        if: always()
        run: scripts/state.sh push
      - name: Usage
        if: always()
        run: |
          if [ -x .venv/bin/acw ]; then uv run --no-sync acw budget; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ github.run_id }}
          path: |
            data/jobs/*/*.json
            data/jobs/*/qa_frames/
          retention-days: 7
