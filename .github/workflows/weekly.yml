# Sunday early morning: build + QA the long-form compilation, schedule it for Sunday noon ET,
# then post the weekly owner digest (as a GitHub issue, which GitHub emails to you).
name: weekly
on:
  schedule:
    - cron: "11 5 * * 0"      # Sun 00:11 EST / 01:11 EDT, before the nightly run
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but never upload"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  weekly:
    if: vars.PIPELINE_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          media: "true"
      - run: scripts/state.sh pull
      - name: Weekly planner (insights, case mix, writer notes)
        continue-on-error: true
        run: uv run --no-sync acw learn
      - name: Compilation + digest
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then uv run --no-sync acw weekly --dry-run --post-digest
          else uv run --no-sync acw weekly --post-digest; fi
      - if: always()
        run: scripts/state.sh push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-${{ github.run_id }}
          path: |
            data/jobs/weekly-*/*.json
            data/jobs/weekly-*/thumbnail.png
          retention-days: 14
