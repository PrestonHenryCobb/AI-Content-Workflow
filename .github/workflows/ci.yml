name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run acw check-config
  offline-render:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Render the fictional test short end to end
        run: uv run acw make-short --job-id ci-offline --offline
