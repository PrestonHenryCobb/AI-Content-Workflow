name: pipeline-setup
description: Python env, ffmpeg, and optionally Claude Code CLI + media models
inputs:
  media:
    description: install Claude Code CLI, CPU torch, Kokoro, faster-whisper
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sqlite3 espeak-ng
    - shell: bash
      run: uv sync --locked
    - if: inputs.media == 'true'
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        uv pip install --index-url https://download.pytorch.org/whl/cpu torch
        uv pip install "kokoro==0.9.4" "soundfile>=0.12" "faster-whisper>=1.1,<2"
